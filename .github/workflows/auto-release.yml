name: Auto release on version bump

# Runs after CI passes on master. If package.json/manifest.json declare a
# version with no matching GitHub Release yet, create the tag + Release,
# build the addon zip and attach it. Nothing happens on ordinary commits.
# NOTE: a Release created with GITHUB_TOKEN does NOT trigger the `release`
# workflow, so this job builds/uploads the zip itself.
# `release.yml` remains for manually created Releases (via UI / dispatch).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-if-bumped:
    # Only release green CI (manual dispatch always runs).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read versions
        id: versions
        run: |
          PKG=$(node -p "require('./package.json').version")
          MAN=$(node -p "require('./manifest.json').version")
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          echo "man=$MAN" >> "$GITHUB_OUTPUT"
          if [ "$PKG" != "$MAN" ]; then
            echo "package.json ($PKG) and manifest.json ($MAN) are out of sync" >&2
            exit 1
          fi

      - name: Create tag + release if missing
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.versions.outputs.pkg }}
        run: |
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.rel.outputs.created == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Install dependencies
        if: steps.rel.outputs.created == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build addon zip
        if: steps.rel.outputs.created == 'true'
        run: pnpm bundle

      - name: Upload zip to release
        if: steps.rel.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: gh release upload "$TAG" dist/*.zip --clobber
